# XcodeGen spec — on Mac: brew install xcodegen && cd ios-native && xcodegen
# Changes: Game Center entitlements for the native Friends board.
# MARKETING_VERSION 1.0.2 (ASC closed the approved 1.0.1 train). Floor CURRENT_PROJECT_VERSION at 9.

name: SpaceSwoosh
options:
  bundleIdPrefix: com.orbi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: SpaceSwoosh/Info.plist
    GENERATE_INFOPLIST_FILE: false
    PRODUCT_BUNDLE_IDENTIFIER: com.orbi.spaceswoosh
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: SpaceSwoosh/SpaceSwoosh.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: "9"
targets:
  SpaceSwoosh:
    type: application
    platform: iOS
    sources:
      - path: SpaceSwoosh
    entitlements:
      path: SpaceSwoosh/SpaceSwoosh.entitlements
      properties:
        com.apple.developer.game-center: true
    dependencies:
      - sdk: GameKit.framework
    settings:
      base:
        PRODUCT_NAME: SpaceSwoosh
        PRODUCT_BUNDLE_IDENTIFIER: com.orbi.spaceswoosh
        CODE_SIGN_ENTITLEMENTS: SpaceSwoosh/SpaceSwoosh.entitlements
    info:
      path: SpaceSwoosh/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarHidden: true
        CFBundleDisplayName: Space Swoosh
