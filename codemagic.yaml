# codemagic.yaml
# Changes:
# - Resolve SPM + archive for generic iOS (Firebase 12 dropped WithoutAdIdSupport).
# - Native iOS writes GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST.
# - Add ios-native-simulator: unsigned iPhone simulator .app for App Preview.
# - Stamp CFBundleVersion via CM_ENV + xcodebuild (agvtool alone left IPA at 1).
# - Inject VITE_SUPABASE_* and VITE_REVENUECAT_IOS_KEY into native Info.plist.
#   APP_STORE_APPLE_ID is also copied for Options → Rate write-review URL.
# - Floor build number at 3 for C.5 TestFlight.
# - Require CERTIFICATE_PRIVATE_KEY for fetch-signing-files. Native → TestFlight.

workflows:
  ios-native-testflight:
    name: iOS Native → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SpaceSwoosh
    environment:
      groups:
        - spaceswoosh
      vars:
        XCODE_PROJECT: ios-native/SpaceSwoosh.xcodeproj
        XCODE_SCHEME: SpaceSwoosh
        BUNDLE_ID: com.orbi.spaceswoosh
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize

          # Apple certs have no private key on the build machine unless we
          # supply one. CERTIFICATE_PRIVATE_KEY (PEM) must live in group
          # spaceswoosh — see docs/CODEMAGIC.md.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY in Codemagic group 'spaceswoosh'."
            echo "Generate once (Windows PowerShell or Git Bash):"
            echo "  openssl genrsa 2048"
            echo "Paste the full PEM (including BEGIN/END lines) as a Secret env var"
            echo "named CERTIFICATE_PRIVATE_KEY, then re-run this workflow."
            exit 1
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY

          keychain add-certificates
          echo "=== Local provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            -v
          echo "=== Export options (if generated) ==="
          cat /Users/builder/export_options.plist 2>/dev/null || true
      - name: Install Firebase config
        script: |
          set -euo pipefail
          PLIST="ios-native/SpaceSwoosh/GoogleService-Info.plist"
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$PLIST"
            echo "Wrote GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST"
          elif [ -f "$PLIST" ]; then
            echo "GoogleService-Info.plist already present"
          else
            echo "ERROR: GoogleService-Info.plist missing."
            echo "Paste the Firebase iOS plist XML into secret GOOGLE_SERVICE_INFO_PLIST in group spaceswoosh."
            exit 1
          fi
      - name: Increment build number
        script: |
          set -euo pipefail
          digits() { printf '%s' "$1" | tr -cd '0-9'; }
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "WARN: APP_STORE_APPLE_ID is empty — TestFlight lookup skipped. Set it in group spaceswoosh."
          fi
          TF=$(digits "$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
          AS=$(digits "$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
          CM=$(digits "${BUILD_NUMBER:-0}")
          TF=${TF:-0}; AS=${AS:-0}; CM=${CM:-0}
          NEXT=$TF
          if [ "$AS" -gt "$NEXT" ]; then NEXT=$AS; fi
          if [ "$CM" -gt "$NEXT" ]; then NEXT=$CM; fi
          NEXT=$((NEXT + 1))
          # ASC already has 1.0.0 (1); repo floor is 3 for C.5.
          if [ "$NEXT" -lt 3 ]; then NEXT=3; fi
          echo "Build numbers — TestFlight=$TF AppStore=$AS Codemagic=$CM → using $NEXT"
          echo "NATIVE_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios-native/SpaceSwoosh/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios-native/SpaceSwoosh/Info.plist
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios-native/SpaceSwoosh/Info.plist)
          echo "Info.plist CFBundleVersion=$STAMPED"
          if [ "$STAMPED" = "1" ] || [ "$STAMPED" = "2" ] || [ "$STAMPED" = '$(CURRENT_PROJECT_VERSION)' ]; then
            echo "ERROR: CFBundleVersion did not increment (still $STAMPED)."
            exit 1
          fi
          if [ -n "${VITE_SUPABASE_URL:-}" ] && [ -n "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $VITE_SUPABASE_URL" ios-native/SpaceSwoosh/Info.plist
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $VITE_SUPABASE_ANON_KEY" ios-native/SpaceSwoosh/Info.plist
            echo "Injected SUPABASE_URL into Info.plist"
          else
            echo "WARN: VITE_SUPABASE_* missing — SPACE BOARD will be offline in this IPA"
          fi
          if [ -n "${VITE_REVENUECAT_IOS_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :REVENUECAT_IOS_KEY $VITE_REVENUECAT_IOS_KEY" ios-native/SpaceSwoosh/Info.plist
            echo "Injected REVENUECAT_IOS_KEY into Info.plist"
          else
            echo "WARN: VITE_REVENUECAT_IOS_KEY missing — ship IAP will be offline in this IPA"
          fi
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :APP_STORE_APPLE_ID $APP_STORE_APPLE_ID" ios-native/SpaceSwoosh/Info.plist
            echo "Injected APP_STORE_APPLE_ID into Info.plist"
          else
            echo "WARN: APP_STORE_APPLE_ID missing — Rate write-review URL fallback offline"
          fi
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build native IPA
        script: |
          EXPORT_PLIST=/Users/builder/export_options.plist
          : "${NATIVE_BUILD_NUMBER:=3}"
          XCARGS="CURRENT_PROJECT_VERSION=${NATIVE_BUILD_NUMBER} MARKETING_VERSION=1.0.0"
          if [ -f "$EXPORT_PLIST" ]; then
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "$XCARGS" \
              --archive-flags="-destination 'generic/platform=iOS'" \
              --export-options-plist "$EXPORT_PLIST"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "$XCARGS" \
              --archive-flags="-destination 'generic/platform=iOS'"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Browser simulator (Codemagic App Preview). Start this workflow manually —
  # it does not sign, upload, or increment TestFlight. After it finishes, click
  # Quick launch next to SpaceSwoosh.app on the build page.
  ios-native-simulator:
    name: iOS Native → App Preview
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - spaceswoosh
      vars:
        XCODE_PROJECT: ios-native/SpaceSwoosh.xcodeproj
        XCODE_SCHEME: SpaceSwoosh
      xcode: latest
    scripts:
      - name: Install Firebase config
        script: |
          set -euo pipefail
          PLIST="ios-native/SpaceSwoosh/GoogleService-Info.plist"
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$PLIST"
            echo "Wrote GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST"
          elif [ -f "$PLIST" ]; then
            echo "GoogleService-Info.plist already present"
          else
            echo "ERROR: GoogleService-Info.plist missing — Analytics App Preview needs GOOGLE_SERVICE_INFO_PLIST."
            exit 1
          fi
      - name: Inject leaderboard credentials
        script: |
          set -euo pipefail
          if [ -n "${VITE_SUPABASE_URL:-}" ] && [ -n "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL $VITE_SUPABASE_URL" ios-native/SpaceSwoosh/Info.plist
            /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY $VITE_SUPABASE_ANON_KEY" ios-native/SpaceSwoosh/Info.plist
            echo "Injected SUPABASE_URL into Info.plist"
          else
            echo "WARN: VITE_SUPABASE_* missing — SPACE BOARD will be offline in App Preview"
          fi
          if [ -n "${VITE_REVENUECAT_IOS_KEY:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :REVENUECAT_IOS_KEY $VITE_REVENUECAT_IOS_KEY" ios-native/SpaceSwoosh/Info.plist
            echo "Injected REVENUECAT_IOS_KEY into Info.plist"
          else
            echo "WARN: VITE_REVENUECAT_IOS_KEY missing — ship IAP will be offline in App Preview"
          fi
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :APP_STORE_APPLE_ID $APP_STORE_APPLE_ID" ios-native/SpaceSwoosh/Info.plist
            echo "Injected APP_STORE_APPLE_ID into Info.plist"
          else
            echo "WARN: APP_STORE_APPLE_ID missing — Rate write-review URL fallback offline"
          fi
      - name: Build unsigned iPhone simulator .app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Stage .app for App Preview
        script: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -name "SpaceSwoosh.app" \
            -path "*/Build/Products/*-iphonesimulator/*" \
            | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: SpaceSwoosh.app (iphonesimulator) not found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" || true
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/build/ios/simulator"
          rm -rf "$CM_BUILD_DIR/build/ios/simulator/SpaceSwoosh.app"
          cp -R "$APP" "$CM_BUILD_DIR/build/ios/simulator/SpaceSwoosh.app"
          echo "Staged $APP"
          ls -la "$CM_BUILD_DIR/build/ios/simulator"
    artifacts:
      - build/ios/simulator/*.app
      - /tmp/xcodebuild_logs/*.log

  android-internal:
    name: Android → Play internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - spaceswoosh
      vars:
        PACKAGE_NAME: com.orbi.spaceswoosh
      node: 22.13.0
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web + sync Capacitor
        script: |
          export VITE_SUPABASE_URL="$VITE_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          export VITE_REVENUECAT_IOS_KEY="$VITE_REVENUECAT_IOS_KEY"
          export VITE_REVENUECAT_ANDROID_KEY="$VITE_REVENUECAT_ANDROID_KEY"
          npm run build:native
      - name: Set version code from build number
        script: |
          echo "VERSION_CODE=$BUILD_NUMBER" >> $CM_ENV
          echo "VERSION_NAME=1.0.$BUILD_NUMBER" >> $CM_ENV
      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "CM_KEYSTORE_PATH=/tmp/keystore.jks" >> $CM_ENV
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Locate AAB
        script: |
          AAB=$(find android -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB" >> $CM_ENV
          ls -la "$AAB"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
