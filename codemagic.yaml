# codemagic.yaml
# Changes:
# - Drop ios_signing early gate (fails if no App Store profile was uploaded to
#   Codemagic identities). Rely on ASC fetch-signing-files --create + use-profiles.
# - iOS signing: verbose use-profiles; export_options.plist only if present.
# - iOS workflow builds native SpriteKit app (ios-native/) only — Capacitor
#   iOS is no longer built or published. Android stays Capacitor.
# - Secrets live in Codemagic environment group "spaceswoosh" — see
#   docs/CODEMAGIC.md.

workflows:
  ios-native-testflight:
    name: iOS Native → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SpaceSwoosh
    environment:
      groups:
        - spaceswoosh
      vars:
        XCODE_PROJECT: ios-native/SpaceSwoosh.xcodeproj
        XCODE_SCHEME: SpaceSwoosh
        BUNDLE_ID: com.orbi.spaceswoosh
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "=== Local provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            -v
          echo "=== Export options (if generated) ==="
          cat /Users/builder/export_options.plist 2>/dev/null || true
      - name: Increment build number
        script: |
          cd ios-native
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build native IPA
        script: |
          EXPORT_PLIST=/Users/builder/export_options.plist
          if [ -f "$EXPORT_PLIST" ]; then
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --export-options-plist "$EXPORT_PLIST"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-internal:
    name: Android → Play internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - spaceswoosh
      vars:
        PACKAGE_NAME: com.orbi.spaceswoosh
      node: 22.13.0
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web + sync Capacitor
        script: |
          export VITE_SUPABASE_URL="$VITE_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          export VITE_REVENUECAT_IOS_KEY="$VITE_REVENUECAT_IOS_KEY"
          export VITE_REVENUECAT_ANDROID_KEY="$VITE_REVENUECAT_ANDROID_KEY"
          npm run build:native
      - name: Set version code from build number
        script: |
          echo "VERSION_CODE=$BUILD_NUMBER" >> $CM_ENV
          echo "VERSION_NAME=1.0.$BUILD_NUMBER" >> $CM_ENV
      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "CM_KEYSTORE_PATH=/tmp/keystore.jks" >> $CM_ENV
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Locate AAB
        script: |
          AAB=$(find android -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB" >> $CM_ENV
          ls -la "$AAB"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
