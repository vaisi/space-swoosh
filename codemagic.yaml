# codemagic.yaml
# Changes:
# - Stamp CFBundleVersion via CM_ENV + xcodebuild (agvtool alone left IPA at 1).
# - Floor build number at 2 — App Store Connect already has 1.0.0 (1).
# - Require CERTIFICATE_PRIVATE_KEY for fetch-signing-files. Native → TestFlight.

workflows:
  ios-native-testflight:
    name: iOS Native → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SpaceSwoosh
    environment:
      groups:
        - spaceswoosh
      vars:
        XCODE_PROJECT: ios-native/SpaceSwoosh.xcodeproj
        XCODE_SCHEME: SpaceSwoosh
        BUNDLE_ID: com.orbi.spaceswoosh
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize

          # Apple certs have no private key on the build machine unless we
          # supply one. CERTIFICATE_PRIVATE_KEY (PEM) must live in group
          # spaceswoosh — see docs/CODEMAGIC.md.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY in Codemagic group 'spaceswoosh'."
            echo "Generate once (Windows PowerShell or Git Bash):"
            echo "  openssl genrsa 2048"
            echo "Paste the full PEM (including BEGIN/END lines) as a Secret env var"
            echo "named CERTIFICATE_PRIVATE_KEY, then re-run this workflow."
            exit 1
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY

          keychain add-certificates
          echo "=== Local provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            -v
          echo "=== Export options (if generated) ==="
          cat /Users/builder/export_options.plist 2>/dev/null || true
      - name: Increment build number
        script: |
          set -euo pipefail
          digits() { printf '%s' "$1" | tr -cd '0-9'; }
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "WARN: APP_STORE_APPLE_ID is empty — TestFlight lookup skipped. Set it in group spaceswoosh."
          fi
          TF=$(digits "$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
          AS=$(digits "$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
          CM=$(digits "${BUILD_NUMBER:-0}")
          TF=${TF:-0}; AS=${AS:-0}; CM=${CM:-0}
          NEXT=$TF
          if [ "$AS" -gt "$NEXT" ]; then NEXT=$AS; fi
          if [ "$CM" -gt "$NEXT" ]; then NEXT=$CM; fi
          NEXT=$((NEXT + 1))
          # ASC already accepted 1.0.0 (1). Never reuse 1.
          if [ "$NEXT" -lt 2 ]; then NEXT=2; fi
          echo "Build numbers — TestFlight=$TF AppStore=$AS Codemagic=$CM → using $NEXT"
          echo "NATIVE_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios-native/SpaceSwoosh/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios-native/SpaceSwoosh/Info.plist
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios-native/SpaceSwoosh/Info.plist)
          echo "Info.plist CFBundleVersion=$STAMPED"
          if [ "$STAMPED" = "1" ] || [ "$STAMPED" = '$(CURRENT_PROJECT_VERSION)' ]; then
            echo "ERROR: CFBundleVersion did not increment (still $STAMPED)."
            exit 1
          fi
      - name: Build native IPA
        script: |
          EXPORT_PLIST=/Users/builder/export_options.plist
          : "${NATIVE_BUILD_NUMBER:=2}"
          XCARGS="CURRENT_PROJECT_VERSION=${NATIVE_BUILD_NUMBER} MARKETING_VERSION=1.0.0"
          if [ -f "$EXPORT_PLIST" ]; then
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "$XCARGS" \
              --export-options-plist "$EXPORT_PLIST"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME" \
              --archive-xcargs "$XCARGS"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-internal:
    name: Android → Play internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - spaceswoosh
      vars:
        PACKAGE_NAME: com.orbi.spaceswoosh
      node: 22.13.0
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web + sync Capacitor
        script: |
          export VITE_SUPABASE_URL="$VITE_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          export VITE_REVENUECAT_IOS_KEY="$VITE_REVENUECAT_IOS_KEY"
          export VITE_REVENUECAT_ANDROID_KEY="$VITE_REVENUECAT_ANDROID_KEY"
          npm run build:native
      - name: Set version code from build number
        script: |
          echo "VERSION_CODE=$BUILD_NUMBER" >> $CM_ENV
          echo "VERSION_NAME=1.0.$BUILD_NUMBER" >> $CM_ENV
      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "CM_KEYSTORE_PATH=/tmp/keystore.jks" >> $CM_ENV
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Locate AAB
        script: |
          AAB=$(find android -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB" >> $CM_ENV
          ls -la "$AAB"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
