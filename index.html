<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SMEY63Z40C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-SMEY63Z40C');
    </script>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the paper ground bleed into the notch / home
         indicator area; the canvas itself is inset by env(safe-area-inset-*)
         below so the HUD never sits under hardware. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#E1D9C1">
    <meta name="description" content="A one-thumb space dodge game in a paper universe. Steer, survive, climb.">
    <title>Space Swoosh</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Brand tokens: loads Space Grotesk + Space Mono and exposes var(--ss-*)
         so DOM chrome (pause button, name input) matches the canvas surfaces. -->
    <link rel="stylesheet" href="/src/brand/tokens.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--ss-paper, #E1D9C1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            /* Native shell hygiene: a WebView will happily rubber-band, long-press
               to select, and flash a tap highlight over the game surface. */
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameContainer {
            width: 100%;
            max-width: 500px;
            min-width: 280px;
            aspect-ratio: 2/3;
            position: relative;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Mobile / packaged app: fill the screen, but keep the drawn surface
           clear of the notch, the status bar and the home indicator. The body
           padding is invisible because its background is the same paper the
           canvas draws, so the ground still reaches every edge. */
        @media (max-width: 768px) {
            body {
                box-sizing: border-box;
                padding:
                    env(safe-area-inset-top)
                    env(safe-area-inset-right)
                    env(safe-area-inset-bottom)
                    env(safe-area-inset-left);
            }
            #gameContainer {
                max-width: 100%;
                aspect-ratio: auto;
                height: 100%;
            }
        }

        /* dvh accounts for the collapsing browser chrome on mobile Safari /
           Chrome, which 100vh overshoots. Declared second so it wins where
           supported and is ignored where it isn't. */
        @supports (height: 100dvh) {
            body {
                min-height: 100dvh;
                height: 100dvh;
            }
        }
    </style>
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
</body>
</html>
