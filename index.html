<!DOCTYPE html>
<!-- index.html — page shell. Changes: body/html chrome is brand ink so the
     cream game stage is letterboxed and its edges read clearly on desktop web;
     #gameContainer keeps paper; theme-color matches the ink surround. -->
<html lang="en">
<head>
    <!-- Analytics is injected from src/services/Analytics.js, and only on the
         web. The packaged app must not pull a remote tracker: it fails offline
         and it drags a third-party SDK into both stores' privacy disclosures. -->
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the ink surround reach the notch / home
         indicator; the cream stage is inset by env(safe-area-inset-*) below
         so the HUD never sits under hardware. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1A1A1A">
    <meta name="description" content="A one-thumb space dodge game in a paper universe. Steer, survive, climb.">
    <title>Space Swoosh</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Brand tokens: loads Space Grotesk + Space Mono and exposes var(--ss-*)
         so DOM chrome (pause button, name input) matches the canvas surfaces. -->
    <link rel="stylesheet" href="/src/brand/tokens.css">
    <style>
        html, body {
            height: 100%;
            background: var(--ss-ink, #1A1A1A);
        }
        body {
            margin: 0;
            padding: 0;
            /* Ink surround — only the cream stage (#gameContainer) is paper, so
               the playfield rectangle is visible against the page. */
            background: var(--ss-ink, #1A1A1A);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            /* Native shell hygiene: a WebView will happily rubber-band, long-press
               to select, and flash a tap highlight over the game surface. */
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameContainer {
            width: 100%;
            max-width: 500px;
            min-width: 280px;
            aspect-ratio: 2/3;
            position: relative;
            /* Paper stage — cream before the canvas paints, and the visible
               frame against the ink page. */
            background: var(--ss-paper, #E1D9C1);
            overflow: hidden;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: var(--ss-paper, #E1D9C1);
        }

        /* Mobile / packaged app: fill the safe area with the cream stage; ink
           shows in the notch / home-indicator insets so the stage edge still
           reads. */
        @media (max-width: 768px) {
            body {
                box-sizing: border-box;
                padding:
                    env(safe-area-inset-top)
                    env(safe-area-inset-right)
                    env(safe-area-inset-bottom)
                    env(safe-area-inset-left);
            }
            #gameContainer {
                max-width: 100%;
                aspect-ratio: auto;
                height: 100%;
            }
        }

        /* dvh accounts for the collapsing browser chrome on mobile Safari /
           Chrome, which 100vh overshoots. Declared second so it wins where
           supported and is ignored where it isn't. */
        @supports (height: 100dvh) {
            body {
                min-height: 100dvh;
                height: 100dvh;
            }
        }
    </style>
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
</body>
</html>
