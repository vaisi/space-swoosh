<!DOCTYPE html>
<!-- index.html — page shell. Changes: #hpHint sits 56px below the
     playfield top (body already carries the safe-area inset). Signal
     blue via --ss-signal. html.ss-ime-open zeros body
     padding-bottom so an IME-inflated safe-area inset cannot shrink
     #gameContainer (Submit Signal layouts from keyboard height). Native
     shell skips favicon / apple-touch-icon links (Android WebView can
     paint a broken icon + truncated "Space Swoosh" as a title strip).
     Hide <audio>/<video> so HTMLAudio BGM cannot show an in-page
     transport. First paint defaults to night paper. Phone and tablet
     browsers play, with a bottom bar that opens the App Store or Play.
     Desktop web shows store QR rails. Android 15
     edge-to-edge uses Capacitor --safe-area-inset-* with env() fallback.
     Native portrait fills the inset stage; landscape letterboxes 2:3. -->
<html lang="en">
<head>
    <!-- Analytics is injected from src/services/Analytics.js, and only on the
         web. The packaged app must not pull a remote tracker: it fails offline
         and it drags a third-party SDK into both stores' privacy disclosures. -->
    <meta charset="UTF-8">
    <!-- Classify web vs native before CSS so the phone download bar and
         desktop QR rails paint with the first frame. Capacitor injects
         window.Capacitor in the native WebView; browsers do not. Phone and
         tablet browsers play (data-web-gate=play). Desktop gets QR rails. -->
    <script>
        (function () {
            var cap = window.Capacitor;
            var native = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
            if (!native && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
                native = true;
            }
            var root = document.documentElement;
            root.dataset.shell = native ? 'native' : 'web';
            var theme = 'dark';
            try {
                var stored = localStorage.getItem('ssTheme');
                if (stored === 'light' || stored === 'dark') theme = stored;
            } catch (e) {}
            root.dataset.theme = theme;
            if (!native) {
                var icon = document.createElement('link');
                icon.rel = 'icon';
                icon.type = 'image/x-icon';
                icon.href = '/favicon.ico';
                document.head.appendChild(icon);
                var touch = document.createElement('link');
                touch.rel = 'apple-touch-icon';
                touch.href = '/apple-touch-icon.png';
                document.head.appendChild(touch);
            }
            if (native) return;
            var ua = navigator.userAgent || '';
            var ios = /iPad|iPhone|iPod/i.test(ua)
                || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
            var android = /Android/i.test(ua);
            var desktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            root.dataset.webGate = desktop ? 'desktop' : 'play';
            root.dataset.storeTarget = ios ? 'ios' : android ? 'android' : 'both';
        })();
    </script>
    <!-- viewport-fit=cover lets the surround reach the notch / home
         indicator; the stage is inset by --safe-area-inset-* (Capacitor
         SystemBars) with env(safe-area-inset-*) fallback so the HUD never
         sits under hardware on Android 15+ edge-to-edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#12100E">
    <meta name="description" content="A one-thumb space dodge game in a paper universe. Steer, survive, climb. Get it on the App Store or Google Play.">
    <title>Space Swoosh</title>
    <!-- Brand tokens: loads Space Grotesk + Space Mono and exposes var(--ss-*)
         so DOM chrome (pause button, name input) matches the canvas surfaces. -->
    <link rel="stylesheet" href="/src/brand/tokens.css">
    <style>
        html, body {
            height: 100%;
            background: var(--ss-surround, var(--ss-ink, #1A1A1A));
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--ss-surround, var(--ss-ink, #1A1A1A));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameContainer {
            width: 100%;
            max-width: 500px;
            min-width: 280px;
            aspect-ratio: 2/3;
            position: relative;
            background: var(--ss-paper, #1C1A16);
            overflow: hidden;
            z-index: 1;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 0;
            touch-action: none;
            background: var(--ss-paper, #1C1A16);
        }

        /* Headphones hint — web, Android WebView, and Capacitor iOS.
           The native shell already pads the body by the safe-area inset,
           so 56px is below that inset. Desktop web has no inset.
           Layers are HTML <svg> elements: Android WebView and WKWebView
           drop CSS transforms on inner <path> nodes. */
        #hpHint {
            position: absolute;
            top: 56px;
            left: 50%;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            pointer-events: none;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 300ms ease;
        }
        #hpHint.is-on {
            opacity: 1;
            transition: opacity 400ms ease 400ms;
        }
        .hp-mark {
            position: relative;
            width: 30px;
            height: 22px;
            flex: none;
            color: var(--ss-signal);
        }
        .hp-mark svg {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            width: 30px;
            height: 22px;
            overflow: visible;
            color: var(--ss-signal);
        }
        .hp-label {
            font-family: var(--ss-font-ui);
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.14em;
            line-height: 1;
            color: var(--ss-ink-55);
            white-space: nowrap;
            animation: hp-text 2.6s ease-in-out infinite;
        }
        .hp-cups { animation: hp-breathe 2.6s ease-in-out infinite; }
        .hp-wave {
            opacity: 0;
            animation: hp-wave 2.6s ease-out infinite;
        }
        .hp-wave2 { animation-delay: .35s; }
        @keyframes hp-breathe {
            0%, 100% { opacity: .55 }
            45% { opacity: 1 }
        }
        @keyframes hp-text {
            0%, 100% { opacity: .7 }
            45% { opacity: 1 }
        }
        @keyframes hp-wave {
            0% { opacity: 0; transform: translateX(-2px) }
            35% { opacity: 1 }
            100% { opacity: 0; transform: translateX(3px) }
        }
        @media (prefers-reduced-motion: reduce) {
            .hp-cups, .hp-label, .hp-wave { animation: none; opacity: 1; }
            #hpHint, #hpHint.is-on { transition: none; }
        }

        /* Game audio is HTMLAudio without controls. Some Android WebViews
           still inject a transport (favicon + page title "Space…"). */
        audio, video {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Dark: charcoal page, beige tunnel so the playfield edge still reads. */
        html[data-theme="dark"] #gameContainer {
            box-shadow: 0 0 0 10px #E1D9C1;
        }

        .store-rail {
            display: none;
        }

        /* Capacitor SystemBars injects --safe-area-inset-* (Android WebView
           < 140); env() is iOS / modern Chromium. HUD stays out of the
           status / nav / cutout regions under Android 15 edge-to-edge. */
        html[data-shell="native"] body {
            box-sizing: border-box;
            padding:
                var(--safe-area-inset-top, env(safe-area-inset-top, 0px))
                var(--safe-area-inset-right, env(safe-area-inset-right, 0px))
                var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))
                var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
        }
        /* IME overlays the stage. Keyboard height is applied in canvas
           layout — do not let --safe-area-inset-bottom grow with Gboard. */
        html.ss-ime-open[data-shell="native"] body {
            padding-bottom: 0;
        }
        /* Native portrait (and phone portrait web): fill the inset stage. */
        html[data-shell="native"] #gameContainer {
            max-width: 100%;
            width: 100%;
            min-width: 0;
            height: 100%;
            aspect-ratio: auto;
            box-shadow: none;
        }
        /* Landscape: keep a tall 2:3 playfield instead of a wide corridor
           (Play large-screen — no android:screenOrientation lock). */
        @media (orientation: landscape) {
            html[data-shell="native"] #gameContainer {
                width: auto;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
                aspect-ratio: 2 / 3;
            }
        }

        /* Phone / tablet browsers play full-bleed, with room under the
           stage for the download bar (including the home-indicator inset).
           Landscape still letterboxes 2:3 so the corridor stays tall. */
        html[data-web-gate="play"] {
            --phone-store-bar: 64px;
        }
        html[data-web-gate="play"] body {
            box-sizing: border-box;
            padding:
                var(--safe-area-inset-top, env(safe-area-inset-top, 0px))
                var(--safe-area-inset-right, env(safe-area-inset-right, 0px))
                calc(var(--phone-store-bar) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))
                var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
        }
        html[data-web-gate="play"] #gameContainer {
            max-width: 100%;
            width: 100%;
            min-width: 0;
            aspect-ratio: auto;
            height: 100%;
            box-shadow: none;
        }
        html[data-web-gate="play"] .store-rail {
            display: none !important;
        }
        @media (orientation: landscape) {
            html[data-web-gate="play"] #gameContainer {
                width: auto;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
                aspect-ratio: 2 / 3;
            }
        }

        /* Desktop web: stage fills viewport height (2:3). Side columns are
           leftover width only — they must not shrink the playfield. */
        @media (min-width: 769px) {
            html[data-web-gate="desktop"] body {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                align-items: stretch;
                justify-items: stretch;
            }
            html[data-web-gate="desktop"] #gameContainer {
                grid-column: 2;
                height: 100%;
                max-height: 100%;
                width: auto;
                max-width: none;
                min-width: 0;
                aspect-ratio: 2 / 3;
            }
            html[data-web-gate="desktop"] .store-rail {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
                min-width: 0;
            }
            html[data-web-gate="desktop"] .store-rail--left { grid-column: 1; }
            html[data-web-gate="desktop"] .store-rail--right { grid-column: 3; }
        }

        .store-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-sizing: border-box;
            width: min(160px, 100%);
            padding: 14px 14px 16px;
            background: #EAE4D2;
            border: 1.5px solid #1A1A1A;
            color: #1A1A1A;
            text-decoration: none;
            pointer-events: auto;
            touch-action: auto;
            -webkit-user-select: none;
            user-select: none;
        }
        .store-qr:hover {
            transform: translateY(-2px);
            transition: transform var(--ss-dur-fast, 120ms) var(--ss-ease-standard, cubic-bezier(0.2, 0, 0, 1));
        }
        .store-qr:focus-visible {
            outline: 1.5px solid var(--ss-signal, #0000FF);
            outline-offset: 3px;
        }
        .store-qr img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
        }
        .store-qr__label {
            margin: 0;
            font-family: var(--ss-font-ui, system-ui, sans-serif);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: var(--ss-track-wide, 0.08em);
            text-transform: uppercase;
            line-height: 1.2;
        }
        .store-qr__hint {
            margin: -4px 0 0;
            font-family: var(--ss-font-ui, system-ui, sans-serif);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            line-height: 1.3;
            color: rgba(26, 26, 26, 0.55);
            text-align: center;
        }

        /* Phone / tablet browsers: one-row download bar under the stage.
           The game keeps running above it. Hidden on desktop and in the app. */
        .phone-store-bar {
            display: none;
        }
        html[data-web-gate="play"] .phone-store-bar {
            display: flex;
            box-sizing: border-box;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: calc(var(--phone-store-bar, 64px) + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
            padding:
                8px
                max(16px, var(--safe-area-inset-right, env(safe-area-inset-right, 0px)))
                max(8px, var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))
                max(16px, var(--safe-area-inset-left, env(safe-area-inset-left, 0px)));
            background: var(--ss-paper, #1C1A16);
            color: var(--ss-ink, #E1D9C1);
            border-top: 1.5px solid var(--ss-ink, #E1D9C1);
            touch-action: manipulation;
            -webkit-user-select: auto;
            user-select: auto;
            -webkit-touch-callout: default;
        }
        .phone-store-bar__copy {
            margin: 0;
            font-family: var(--ss-font-ui, system-ui, sans-serif);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: var(--ss-track-wide, 0.08em);
            text-transform: uppercase;
            line-height: 1.2;
        }
        .phone-store-bar__actions {
            display: flex;
            flex: none;
            gap: 8px;
        }
        .phone-store-bar__cta {
            text-decoration: none;
            box-sizing: border-box;
        }
        .phone-store-bar__cta .ss-btn__label {
            padding: 12px 16px;
            font-size: 13px;
        }
        html[data-store-target="ios"] .phone-store-bar__cta--play,
        html[data-store-target="android"] .phone-store-bar__cta--ios {
            display: none;
        }

        /* dvh accounts for the collapsing browser chrome on mobile Safari /
           Chrome, which 100vh overshoots. Declared second so it wins where
           supported and is ignored where it isn't. */
        @supports (height: 100dvh) {
            body {
                min-height: 100dvh;
                height: 100dvh;
            }
        }
    </style>
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <aside class="store-rail store-rail--left">
        <a class="store-qr"
           data-store="ios"
           href="https://apps.apple.com/app/id6801885446"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Download Space Swoosh on the App Store">
            <img src="/qr/ios.svg" width="240" height="240" alt="">
            <p class="store-qr__label">App Store</p>
            <p class="store-qr__hint">Scan to fly on iPhone</p>
        </a>
    </aside>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="hpHint" role="img" aria-label="Headphones recommended for the best experience.">
            <span class="hp-mark" aria-hidden="true">
                <svg class="hp-cups" width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 14v-3a8 8 0 0 1 16 0v3"/>
                    <path d="M3 14a1.8 1.8 0 0 1 1.8-1.8h1.4v7H4.8A1.8 1.8 0 0 1 3 17.4z" fill="currentColor" fill-opacity="0.18"/>
                    <path d="M19 14a1.8 1.8 0 0 0-1.8-1.8h-1.4v7h1.4a1.8 1.8 0 0 0 1.8-1.8z" fill="currentColor" fill-opacity="0.18"/>
                </svg>
                <svg class="hp-wave" width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22.5 12.5a3 3 0 0 1 0 5"/>
                </svg>
                <svg class="hp-wave hp-wave2" width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M25.5 10.5a6 6 0 0 1 0 9"/>
                </svg>
            </span>
            <span class="hp-label" aria-hidden="true">HEADPHONES RECOMMENDED</span>
        </div>
    </div>
    <aside class="store-rail store-rail--right">
        <a class="store-qr"
           data-store="play"
           href="https://play.google.com/store/apps/details?id=com.orbi.spaceswoosh"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Download Space Swoosh on Google Play">
            <img src="/qr/android.svg" width="240" height="240" alt="">
            <p class="store-qr__label">Google Play</p>
            <p class="store-qr__hint">Scan to fly on Android</p>
        </a>
    </aside>

    <aside class="phone-store-bar" aria-label="Download Space Swoosh">
        <p class="phone-store-bar__copy">Get the app</p>
        <div class="phone-store-bar__actions">
            <a class="ss-btn ss-btn--primary phone-store-bar__cta phone-store-bar__cta--ios"
               data-store="ios"
               href="https://apps.apple.com/app/id6801885446"
               rel="noopener noreferrer">
                <span class="ss-btn__label">App Store</span>
            </a>
            <a class="ss-btn ss-btn--primary phone-store-bar__cta phone-store-bar__cta--play"
               data-store="play"
               href="https://play.google.com/store/apps/details?id=com.orbi.spaceswoosh"
               rel="noopener noreferrer">
                <span class="ss-btn__label">Google Play</span>
            </a>
        </div>
    </aside>
</body>
</html>
